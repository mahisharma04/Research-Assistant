kind = "web"
previewPath = "/"
title = "Research Assistant for College Students"
description = "A Streamlit research assistant for college students. Three LangGraph agents search the web, write a source-grounded summary, and review it for unsupported claims."
version = "1.0.0"
id = "artifacts/research-assistant"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "cd ../.. && streamlit run app.py --server.port 5000 --server.address 0.0.0.0 --server.headless true"

[services.production.build]
args = ["python", "-m", "pip", "install", "-r", "../../requirements.txt"]

[services.production.run]
args = ["streamlit", "run", "../../app.py", "--server.port", "5000", "--server.address", "0.0.0.0", "--server.headless", "true"]

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "5000"
